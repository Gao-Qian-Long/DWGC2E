name: app-ci

on:
  push:
    branches: [pro]
    paths-ignore:
      - "cf-worker/**"
  pull_request:
    branches: [pro]
    paths-ignore:
      - "cf-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore core tests
        run: dotnet restore tests/DwgTranslator.Core.Tests/DwgTranslator.Core.Tests.csproj -p:NuGetAudit=false

      - name: Run core tests
        run: dotnet test tests/DwgTranslator.Core.Tests/DwgTranslator.Core.Tests.csproj --configuration Debug --no-restore --verbosity normal

      - name: Build layout regression tool
        run: dotnet build tests/DwgTranslator.LayoutRegression/LayoutRegression.csproj --configuration Debug -p:NuGetAudit=false --verbosity minimal

      - name: Build WPF app and UI smoke
        run: dotnet build tests/DwgTranslator.App.UiSmoke/DwgTranslator.App.UiSmoke.csproj --configuration Debug -p:SkipCadPluginBuild=true -p:NuGetAudit=false --verbosity minimal

      - name: Run WPF UI smoke
        run: dotnet run --project tests/DwgTranslator.App.UiSmoke/DwgTranslator.App.UiSmoke.csproj --configuration Debug --no-build -p:SkipCadPluginBuild=true
